<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración | Flamenco Events</title><style>
body{background:#171312;color:#f2e9df;font:16px system-ui;margin:0}header,main{padding:20px;max-width:960px;margin:auto}header{color:#d9b37e;font:28px Georgia}section{background:#271f1c;border:1px solid #5b4538;border-radius:12px;padding:18px;margin:14px 0}button,input{padding:12px;font:inherit;margin:5px;border-radius:6px}button{background:#d9b37e;border:0}input{background:#382b25;color:white;border:1px solid #705748}label{display:block}.hidden{display:none}a{color:#d9b37e}</style></head>
<body><header>Flamenco Events · Administración</header><main><p id="status" role="status"></p><section id="signin"><h1>Acceso privado</h1><form id="login"><label>Email<input name="email" type="email" required></label><button>Recibir enlace</button></form></section><div id="workspace" class="hidden"><button id="logout">Salir</button><h1>Resumen administrativo</h1><section><p id="metrics"></p></section><section><h2>Nuevo evento aceptado</h2><p>Asigna únicamente un cliente cuya identidad haya sido verificada. La reserva no quedará confirmada por este paso.</p><form id="create-event"><label>Solicitud con presupuesto aceptado<select name="enquiry_id" id="enquiry-select" required><option value="">Selecciona una solicitud aceptada</option></select></label><label>ID del cliente (UUID)<input name="client_id" required pattern="[0-9a-fA-F-]{36}"></label><label>Nombre del evento<input name="title" maxlength="150" required></label><label>Fecha<input name="event_date" type="date"></label><label>Lugar<input name="venue" maxlength="180"></label><button>Crear evento pendiente de contrato</button></form></section><section><h2>Eventos</h2><div id="event-list"></div></section><section><h2>Solicitudes</h2><div id="lead-list"></div></section><p><a href="./staff.html">Ir al panel del equipo</a></p></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="./portal-config.js"></script><script>
const c=window.FE_PORTAL_CONFIG,db=c?.url&&c?.anonKey?supabase.createClient(c.url,c.anonKey):null;
const el=x=>document.getElementById(x),safe=x=>String(x??'').replace(/[&<>"]/g,k=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[k]));
async function load(){if(!db){el('status').textContent='Sin configurar';return}const {data}=await db.auth.getUser();if(!data?.user){el('signin').classList.remove('hidden');el('workspace').classList.add('hidden');return}const p=await db.from('profiles').select('role').eq('id',data.user.id).maybeSingle();if(p.error||p.data?.role!=='admin'){el('signin').classList.add('hidden');el('workspace').classList.add('hidden');el('status').textContent='Acceso administrativo denegado';return}const [ev,leads]=await Promise.all([db.from('events').select('title,event_date,status').order('event_date'),db.from('enquiries').select('id,contact_name,stage,service')]);if(ev.error||leads.error){el('status').textContent=(ev.error||leads.error).message;return}el('signin').classList.add('hidden');el('workspace').classList.remove('hidden');el('metrics').textContent=ev.data.length+' eventos · '+leads.data.length+' solicitudes';el('enquiry-select').innerHTML='<option value="">Selecciona una solicitud aceptada</option>'+leads.data.filter(e=>e.stage==='accepted').map(e=>'<option value="'+safe(e.id)+'">'+safe(e.contact_name)+' · '+safe(e.service||'')+'</option>').join('');el('event-list').innerHTML=ev.data.map(e=>'<p>'+safe(e.title)+' · '+safe(e.event_date)+' · '+safe(e.status)+'</p>').join('')||'Sin eventos';el('lead-list').innerHTML=leads.data.map(x=>'<p>'+safe(x.contact_name)+' · '+safe(x.service)+' · '+safe(x.stage)+'</p>').join('')||'Sin solicitudes'}
el('login').addEventListener('submit',async e=>{e.preventDefault();const x=await db.auth.signInWithOtp({email:e.target.elements.email.value,options:{emailRedirectTo:location.href.split('#')[0]}});el('status').textContent=x.error?.message||'Revisa tu correo'});
el('create-event').addEventListener('submit',async e=>{e.preventDefault();const form=e.target;const entry={enquiry_id:form.elements.enquiry_id.value,client_id:form.elements.client_id.value.trim(),title:form.elements.title.value.trim(),event_date:form.elements.event_date.value||null,venue:form.elements.venue.value.trim()||null,status:'accepted'};const result=await db.from('events').insert(entry);el('status').textContent=result.error?result.error.message:'Evento creado; reserva pendiente de formalizar';if(!result.error){form.reset();await load()}});
el('logout').addEventListener('click',async()=>{await db.auth.signOut();load()});if(db)db.auth.onAuthStateChange(()=>queueMicrotask(load));load();
</script></body></html>
