<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flamenco Events App — Demo</title><style>:root{--r:#772e32;--g:#be9a62;--b:#211c1b}*{box-sizing:border-box}body{margin:0;background:#f9f6f1;color:var(--b);font:16px system-ui,-apple-system,sans-serif}header{padding:19px 16px;background:#201b19;color:#f8e4cd;display:flex;align-items:center;justify-content:space-between}header strong{font:26px Georgia,serif}header small{display:block;letter-spacing:2px;font-size:9px}button,select,input,textarea{font:inherit}button{border:0;cursor:pointer}.lang{background:#443a34;color:white;padding:8px;border:1px solid #887969;border-radius:8px}.demo{background:#eadac4;color:#594536;text-align:center;padding:8px;font-size:12px}.wrap{padding:22px 17px 110px;max-width:860px;margin:auto}h1,h2,h3{font-family:Georgia,serif}h1{font-size:36px}h2{font-size:28px;color:var(--r)}p{line-height:1.5}.muted{color:#736c66}.hero{padding:65px 24px;text-align:center;color:#fff4e6;background:linear-gradient(125deg,#271b1b,#773033)}.hero p{max-width:460px;margin:20px auto}.btn{background:var(--r);color:white;padding:12px 15px;border-radius:8px;margin:4px}.btn.alt{background:#f1e6d8;color:var(--r)}.btn:disabled{opacity:.35;cursor:not-allowed}.card{background:white;padding:18px;border-radius:14px;border:1px solid #eadfd4;margin:12px 0;box-shadow:0 3px 12px #271b1b0b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.field{display:block;margin:15px 0}.field span{display:block;margin-bottom:6px;font-weight:600}.field input,.field select,.field textarea{width:100%;border:1px solid #cdbdb3;border-radius:8px;background:white;padding:11px}.field textarea{min-height:90px}.notice{background:#f0e4d1;padding:14px;border-radius:9px;margin:15px 0}.status{color:var(--r);font-size:13px;font-weight:700}.bottom{position:fixed;bottom:0;left:0;right:0;display:flex;background:#231d1c;color:white;justify-content:space-around;padding-bottom:env(safe-area-inset-bottom)}.bottom button{background:none;color:#eee0d5;flex:1;padding:13px 2px;font-size:11px}.bottom button.on{color:#f3be7e;border-top:3px solid #f3be7e}.bottom span{display:block;font-size:21px}.tags{display:flex;gap:8px;flex-wrap:wrap}.tag{background:#f4e5d7;padding:7px 10px;border-radius:30px;font-size:12px}.warning{border-left:4px solid var(--r)}</style></head><body><div class="demo" id="demo">DEMO · Datos ficticios · Sin envíos reales</div><header><div><strong>Flamenco Events</strong><small>EXPERTOS EN DÍAS ESPECIALES</small></div><select class="lang" id="lang" onchange="setlang(this.value)"><option value="es">ES</option><option value="en">EN</option></select></header><div id="app"></div><nav class="bottom" id="nav"></nav><script>
const K="fe-app-github-demo-1";let s;try{s=JSON.parse(localStorage.getItem(K)||"null")}catch(e){}s=s||{lang:"es",tab:"home",requests:[]};const catalog=[["1.1","Guitarra solista","Solo guitar"],["1.2","Dúo de guitarras","Guitar duo"],["1.3","Guitarra y flauta","Guitar and flute"],["1.4","Guitarra y violín","Guitar and violin"],["1.5","Guitarra y percusión","Guitar and percussion"],["2.1","Son del Alma Dúo","Son del Alma Duo"],["2.2","Son del Alma Trío","Son del Alma Trio"],["3.1","Suite Flamenca Trío","Suite Flamenca Trio"],["3.2","Suite Flamenca Cuarteto","Suite Flamenca Quartet"],["3.3","Suite Flamenca Especial","Special Suite Flamenca"],["4.1","DJ con equipo","DJ with equipment"],["4.2","Sonorización","Sound services"]];const texts={es:{home:"Inicio",services:"Experiencias",request:"Solicitar",azahara:"Azahara",client:"Mi evento",hero:"El flamenco de tu evento, a tu medida",intro:"Experiencias exclusivas para los días más especiales.",cta:"Solicitar actuación",all:"Ver experiencias",tip:"Azahara llamará personalmente antes del envío de cualquier presupuesto.",steps:"Solicitud → Llamada → Aprobación → Presupuesto → Aceptación → Área privada",servicesTitle:"Nuestras experiencias",formTitle:"Cuéntanos tu evento",name:"Nombre",phone:"Teléfono",email:"Correo electrónico",date:"Fecha del evento",place:"Lugar",type:"Formación",duration:"Duración y pases",sound:"Sonido e iluminación",notes:"Comentarios",yes:"Sí",no:"No",submit:"Registrar solicitud (demo)",received:"Solicitud registrada. No se ha enviado ningún presupuesto.",dash:"Panel de Azahara · Simulación",call:"Registrar llamada",approve:"Autorizar presupuesto",accept:"Simular aceptación",empty:"Aún no hay solicitudes.",private:"Área privada del cliente",locked:"Solo disponible tras la aceptación del presupuesto.",docs:"Documentos del evento",quote:"Presupuesto de demostración",contract:"Contrato pendiente de firma",reserve:"La aceptación comercial no equivale a una reserva formal confirmada.",reset:"Reiniciar simulación",new:"Solicitud recibida",called:"Llamada completada",sent:"Presupuesto autorizado",accepted:"Presupuesto aceptado"},en:{home:"Home",services:"Experiences",request:"Enquire",azahara:"Azahara",client:"My event",hero:"Flamenco tailored to your event",intro:"Exclusive experiences for life's most special moments.",cta:"Enquire now",all:"Explore experiences",tip:"Azahara will personally call before any quotation is sent.",steps:"Enquiry → Call → Approval → Quote → Acceptance → Private area",servicesTitle:"Our experiences",formTitle:"Tell us about your event",name:"Name",phone:"Phone",email:"Email",date:"Event date",place:"Venue",type:"Performance",duration:"Duration and sets",sound:"Sound and lighting",notes:"Notes",yes:"Yes",no:"No",submit:"Save enquiry (demo)",received:"Enquiry saved. No quotation has been sent.",dash:"Azahara dashboard · Simulation",call:"Record phone call",approve:"Approve quotation",accept:"Simulate acceptance",empty:"No enquiries yet.",private:"Private client area",locked:"Available only after the quotation is accepted.",docs:"Event documents",quote:"Sample quotation",contract:"Contract awaiting signature",reserve:"Commercial acceptance does not confirm a formal booking.",reset:"Reset simulation",new:"Enquiry received",called:"Call completed",sent:"Quote approved",accepted:"Quote accepted"}};const t=k=>texts[s.lang][k]||k;const h=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const save=()=>localStorage.setItem(K,JSON.stringify(s));const name=id=>{let q=catalog.find(a=>a[0]===id);return q?q[s.lang==="es"?1:2]:id};function go(tab){s.tab=tab;save();render();scrollTo(0,0)}function setlang(v){s.lang=v;save();render()}function render(){document.documentElement.lang=s.lang;document.getElementById("lang").value=s.lang;document.getElementById("demo").textContent=s.lang==="es"?"DEMO · Datos ficticios · Sin envíos reales":"DEMO · Fictional data · No real submissions";let tabs=[["home","⌂"],["services","♫"],["request","✎"],["azahara","☷"],["client","▣"]];document.getElementById("nav").innerHTML=tabs.map(([id,i])=>'<button class="'+(s.tab===id?"on":"")+'" onclick="go(\''+id+'\')"><span>'+i+'</span>'+t(id)+'</button>').join("");let out="";if(s.tab==="home")out='<div class="hero"><h1>'+t("hero")+'</h1><p>'+t("intro")+'</p><button class="btn" onclick="go(\'request\')">'+t("cta")+'</button><button class="btn alt" onclick="go(\'services\')">'+t("all")+'</button></div><main class="wrap"><div class="notice">'+t("steps")+'</div><p>'+t("tip")+'</p></main>';if(s.tab==="services")out='<main class="wrap"><h2>'+t("servicesTitle")+'</h2><div class="grid">'+catalog.map(a=>'<article class="card"><span class="status">'+a[0]+'</span><h3>'+h(name(a[0]))+'</h3><button class="btn" onclick="choose(\''+a[0]+'\')">'+t("cta")+'</button></article>').join("")+'</div></main>';if(s.tab==="request"){let fields=[["name","text"],["phone","tel"],["email","email"],["date","date"],["place","text"],["duration","text"]];out='<main class="wrap"><h2>'+t("formTitle")+'</h2><div class="notice">'+t("tip")+'</div><form class="card" onsubmit="submitForm(event)">'+fields.map(([k,type])=>'<label class="field"><span>'+t(k)+'</span><input name="'+k+'" type="'+type+'" '+(k==="duration"?"":"required")+'></label>').join("")+'<label class="field"><span>'+t("type")+'</span><select name="type">'+catalog.map(a=>'<option value="'+a[0]+'" '+(s.selected===a[0]?"selected":"")+'>'+h(name(a[0]))+'</option>').join("")+'</select></label><label class="field"><span>'+t("sound")+'</span><select name="sound"><option value="yes">'+t("yes")+'</option><option value="no">'+t("no")+'</option></select></label><label class="field"><span>'+t("notes")+'</span><textarea name="notes"></textarea></label><button class="btn" type="submit">'+t("submit")+'</button></form></main>'}if(s.tab==="azahara")out='<main class="wrap"><h2>'+t("dash")+'</h2><div class="notice warning">'+(s.lang==="es"?"Panel no protegido: únicamente datos ficticios.":"Unprotected demo: fictional data only.")+'</div>'+(s.requests.length?s.requests.slice().reverse().map(r=>'<article class="card"><div class="status">'+t(r.status)+'</div><h3>'+h(r.name)+'</h3><p>'+h(r.phone)+' · '+h(r.email)+'</p><p>'+h(name(r.type))+' · '+h(r.date)+' · '+h(r.place)+'</p><button class="btn" '+(r.status!=="new"?"disabled":"")+' onclick="advance(\''+r.id+'\',\'called\')">'+t("call")+'</button><button class="btn alt" '+(r.status!=="called"?"disabled":"")+' onclick="advance(\''+r.id+'\',\'sent\')">'+t("approve")+'</button><button class="btn alt" '+(r.status!=="sent"?"disabled":"")+' onclick="advance(\''+r.id+'\',\'accepted\')">'+t("accept")+'</button></article>').join(""):'<p>'+t("empty")+'</p>')+'<button class="btn alt" onclick="reset()">'+t("reset")+'</button></main>';if(s.tab==="client"){let a=s.requests.filter(r=>r.status==="accepted");out='<main class="wrap"><h2>'+t("private")+'</h2>'+(a.length?a.map(r=>'<article class="card"><h3>'+h(r.name)+'</h3><p>'+h(name(r.type))+' — '+h(r.date)+' — '+h(r.place)+'</p><h3>'+t("docs")+'</h3><div class="tags"><span class="tag">'+t("quote")+'</span><span class="tag">'+t("contract")+'</span></div><p class="notice">'+t("reserve")+'</p></article>').join(""):'<div class="card">'+t("locked")+'</div>')+'</main>'}document.getElementById("app").innerHTML=out}function choose(id){s.selected=id;go("request")}function submitForm(ev){ev.preventDefault();let d=Object.fromEntries(new FormData(ev.target));s.requests.push({...d,id:String(Date.now()),status:"new"});save();alert(t("received"));go("azahara")}function advance(id,to){const r=s.requests.find(r=>r.id===id);if(!r)return;const next={new:"called",called:"sent",sent:"accepted"};if(next[r.status]!==to)return;r.status=to;save();render()}function reset(){if(confirm("Reset demo?")){s.requests=[];save();render()}}render();</script></body></html>
