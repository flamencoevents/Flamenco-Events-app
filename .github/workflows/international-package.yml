name: Prepare international website (not published)

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/build_international_site.py"
      - ".github/workflows/international-package.yml"

permissions:
  contents: read

jobs:
  package-international:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build standalone international site
        run: python3 tools/build_international_site.py --output international-build
      - name: Check release safety and files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("international-build")
          pages = sorted(root.glob("*.html"))
          assert len(pages) == 5, f"Expected five HTML pages, found {len(pages)}"
          assert (root / "index.html").is_file()
          assert (root / "assets" / "logo-agency.webp").is_file()
          assert not (root / "CNAME").exists(), "Custom domain must not be configured yet"
          for path in pages:
              html = path.read_text(encoding="utf-8")
              assert 'noindex,nofollow' in html, f"Preview made indexable: {path}"
              assert '../portal.html' not in html, f"Unresolved private portal: {path}"
              assert '-en.html' not in html, f"Preview-only link: {path}"
              assert 'flamencoeventsagency.com' not in html, f"Unowned domain used: {path}"
          print("English standalone website package validated; no publication enabled.")
          PY
      - name: Store preview package for review
        uses: actions/upload-artifact@v4
        with:
          name: flamenco-events-agency-english-preview
          path: international-build/
          include-hidden-files: true
          retention-days: 14
