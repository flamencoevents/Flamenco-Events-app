name: Importar imágenes Divulgarte (solo staging)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/divulgarte-images.yml'
      - 'scripts/divulgarte_import_images.py'
      - 'scripts/divulgarte_collect_media.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: divulgarte-images-import
  cancel-in-progress: false
jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Guardar multimedia pública en el repositorio
        run: python scripts/divulgarte_collect_media.py
      - name: Recuperar referencias visuales de la galería original
        run: python scripts/divulgarte_import_images.py
      - name: Guardar imágenes y referencias
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add divulgarte-preview/
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Import local visual assets for Divulgarte staging"
          git push origin main
