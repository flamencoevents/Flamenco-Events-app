name: Browser mobile and unauthenticated access smoke
on:
  push:
    branches:
      - feature/staff-console-20261103
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test runtime
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test real mobile pages without auth
        run: node scripts/browser-smoke.cjs
