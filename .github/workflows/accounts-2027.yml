name: Cuentas 2027 - comprobacion sin escrituras
on:
  push:
    paths:
      - 'tools/accounts_2027*'
      - 'tools/accounts_history.py'
      - 'tests/test_accounts_history.py'
      - 'tests/test_accounts_2027*'
      - '.github/workflows/accounts-2027.yml'
  pull_request:
    paths:
      - 'tools/accounts_2027*'
      - 'tools/accounts_history.py'
      - 'tests/test_accounts_history.py'
      - 'tests/test_accounts_2027*'
      - '.github/workflows/accounts-2027.yml'
permissions:
  contents: read
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Pruebas ficticias sin servicios ni credenciales
        run: python3 -m unittest discover -s tests -p 'test_accounts_2027*.py' -v
      - name: Historical native source projection tests
        run: python3 -m unittest discover -s tests -p 'test_accounts_history.py' -v
      - name: Sintaxis del ensayo local sin importar dependencias ni abrir archivos
        run: node --check tools/accounts_2027_roundtrip.mjs
