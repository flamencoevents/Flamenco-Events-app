name: Validate static application
on:
  push:
    branches:
      - 'feature/**'
  pull_request:
permissions:
  contents: read
jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-static.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/invite-accepted-client/index.ts
      - run: deno check supabase/functions/assign-sales-role/index.ts
