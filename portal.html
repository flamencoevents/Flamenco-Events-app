<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#181312"><title>Mi evento | Flamenco Events</title>
<style>
*{box-sizing:border-box}input,select,textarea{max-width:100%}section,article{min-width:0;overflow-wrap:anywhere}button{max-width:100%;white-space:normal}@media(max-width:540px){main,header{padding:14px}input,select,textarea{width:100%;margin-left:0;margin-right:0}button{min-height:44px}}

:root{--bg:#161312;--panel:#211b1a;--line:#47372f;--gold:#d1ac72;--text:#f4ebe0;--muted:#b9a89c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}header{padding:20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}header b{font:26px Georgia,serif;color:var(--gold)}button,input,textarea{font:inherit}button{border:0;border-radius:9px;padding:12px 16px;background:var(--gold);color:#201610;font-weight:700;cursor:pointer}button.secondary{background:#352b29;color:var(--text);border:1px solid var(--line)}button:disabled{opacity:.5}input,textarea{width:100%;padding:12px;border-radius:9px;border:1px solid #67544a;color:var(--text);background:#2b2220}textarea{min-height:90px}.wrap{max-width:840px;margin:25px auto;padding:0 18px 80px}h1,h2,h3{font-family:Georgia,serif;font-weight:400}h1{font-size:35px}h2{color:var(--gold)}p{line-height:1.55}.muted{color:var(--muted)}.card{padding:20px;border-radius:14px;background:var(--panel);border:1px solid var(--line);margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.grid .card{margin:0}.label{color:var(--gold);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.4px}.field{display:block;margin:15px 0}.field span{display:block;margin-bottom:7px}.error{padding:12px;border-left:3px solid #e79c85;background:#492b27}.status{background:#382f26;color:#ebd6ae;padding:6px 10px;border-radius:20px;font-size:12px}.docs{display:flex;flex-wrap:wrap;gap:10px}.docs a{color:#f5dab0;border:1px solid var(--line);padding:10px;border-radius:8px}nav{display:flex;gap:6px;align-items:center}a{color:var(--gold)}@media(max-width:540px){header b{font-size:20px}header{padding:15px}.wrap{margin:12px auto}button{padding:11px}}
</style></head><body><div role="status" style="padding:10px;text-align:center;background:#47372f">MODO PRUEBA · TEST MODE</div><header><div><b>Flamenco Events</b><div class="label">Espacio cliente · Portal seguro</div></div><nav><button class="secondary" id="lang" onclick="toggleLang()">EN</button><button class="secondary" id="signout" onclick="signOut()" hidden>Salir</button></nav></header>
<main id="app" class="wrap"><h1>Mi evento</h1><p>Preparando acceso...</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="./portal-config.js"></script><script src="./ui-state.js"></script><script src="./workflow.js"></script>
<script>
/* Public anon key is intended to be browser-visible. Never put a service_role key here. */
let db=null,language='es',me=null,role='client',department='home',events=[],requests=[],documents=[],notifications=[],contracts=[],tasks=[],quoteTerms=[],payments=[];
const dict={es:{title:'Tu evento, perfectamente coordinado',subtitle:'Presupuesto, firma de contrato, repertorio, vestuario, horarios y coordinación, en un mismo lugar.',email:'Correo electrónico',send:'Enviarme un enlace de acceso',login:'Accede con tu correo',sent:'Revisa tu correo para acceder.',signout:'Salir',noevents:'Aún no tienes eventos asignados. El equipo de Flamenco Events te invitará después de aceptar tu presupuesto.',staff:'Eventos del equipo',event:'Mi evento',quote:'Presupuesto',contract:'Contrato',wardrobe:'Vestuario',repertoire:'Repertorio',schedule:'Horarios',contact:'Contacto en el evento',updates:'Solicitar un cambio',message:'Escribe los detalles para que nuestro equipo pueda revisarlos',sendchange:'Enviar comentario',saved:'Comentario enviado al equipo.',messages:'Conversación del evento',nodoc:'Pendiente de incorporar',none:'Pendiente de definir',booking:'La aceptación comercial no equivale por sí sola a una reserva formalmente confirmada.',unconfigured:'El portal está preparado, pero todavía no se ha conectado una base de datos privada. Esta página no acepta datos reales.'},en:{title:'Your event, carefully coordinated',subtitle:'Quotation, contract, repertoire, wardrobe, schedule and coordination together.',email:'Email address',send:'Email me a sign-in link',login:'Sign in with your email',sent:'Check your inbox for the sign-in link.',signout:'Sign out',noevents:'No events are linked to your account yet. The Flamenco Events team will invite you after you accept your quotation.',staff:'Team events',event:'My event',quote:'Quotation',contract:'Contract',wardrobe:'Dress code',repertoire:'Repertoire',schedule:'Schedule',contact:'On-site contact',updates:'Request an update',message:'Tell the team what you would like to change',sendchange:'Send message',saved:'Message sent to the team.',messages:'Event conversation',nodoc:'Not yet available',none:'To be confirmed',booking:'Acceptance alone does not formally confirm a booking.',unconfigured:'The portal is ready, but no private database is connected yet. Do not submit real data.'}};
Object.assign(dict.es,{"notifications": "Avisos", "markRead": "Marcar leído", "noNotifications": "Sin avisos", "acceptedQuote": "Presupuesto aceptado", "payments": "Pagos", "noPayments": "Pendiente de información", "tasks": "Tareas", "noTasks": "Sin tareas asignadas", "documents": "Documentos", "contractPending": "Contrato pendiente", "proposals": "Propuestas", "proposalSend": "Enviar propuesta", "other": "Otro", "approved": "Aprobada", "rejected": "Rechazada", "pending": "Pendiente", "portalLabel": "Espacio cliente · Portal seguro", "accessError": "Error de acceso", "meLabel": "Yo", "proposalDetails": "Detalles de la propuesta", "proposalTopic": "Tipo de propuesta"});
Object.assign(dict.en,{"notifications": "Notifications", "markRead": "Mark read", "noNotifications": "No notifications", "acceptedQuote": "Accepted quotation", "payments": "Payments", "noPayments": "No payment milestones", "tasks": "Tasks", "noTasks": "No assigned tasks", "documents": "Documents", "contractPending": "Contract pending", "proposals": "Proposals", "proposalSend": "Send proposal", "other": "Other", "approved": "Approved", "rejected": "Rejected", "pending": "Pending", "portalLabel": "Client area · Secure portal", "accessError": "Access error", "meLabel": "Me", "proposalDetails": "Proposal details", "proposalTopic": "Proposal type"});
const t=k=>dict[language][k]||k;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function show(x){document.documentElement?.setAttribute('lang',language);const headerLabel=document.querySelector?.('header .label');if(headerLabel)headerLabel.textContent=t('portalLabel');document.getElementById('app').innerHTML=x;document.getElementById('lang').textContent=language==='es'?'EN':'ES';document.getElementById('signout').hidden=!me}
function toggleLang(){language=language==='es'?'en':'es';render()}
function start(){const cfg=window.FE_PORTAL_CONFIG; if(!cfg||!cfg.url||!cfg.anonKey){render();return}try{db=window.supabase.createClient(cfg.url,cfg.anonKey);db.auth.onAuthStateChange(()=>{setTimeout(refresh,0)});refresh()}catch(e){show('<h1>'+t('title')+'</h1><p class="error">'+esc(e.message)+'</p>')}}
let refreshEpoch=0;async function refresh(){const epoch=++refreshEpoch;if(!db)return render();const {data,error}=await db.auth.getUser();if(epoch!==refreshEpoch)return;me=error?null:data.user;if(me){const p=await db.from('profiles').select('role').eq('id',me.id).maybeSingle();if(epoch!==refreshEpoch)return;if(p.error)return show('<p class="error">'+esc(p.error.message)+'</p>');role=['admin','sales'].includes(p.data?.role)?p.data.role:'client';if(role==='sales'){location.replace('./staff.html');return}if(role==='admin'){events=[];requests=[];documents=[];notifications=[];contracts=[];tasks=[];quoteTerms=[];payments=[];render();return}const result=await db.from('events').select('id,enquiry_id,quote_terms_id,title,venue,event_date,performance,status,quotation_url,contract_url,wardrobe,repertoire,schedule_notes,onsite_contact').order('event_date',{ascending:true});if(epoch!==refreshEpoch)return;events=result.data||[];const [rq,dc,nt,ct,tk,qt,py]=await Promise.all([db.from('event_change_requests').select('*').order('created_at',{ascending:false}),db.from('event_documents').select('*'),db.from('notifications').select('*').order('created_at',{ascending:false}).limit(100),db.from('event_contracts').select('id,event_id,template_kind,state,signed_at'),db.from('event_tasks').select('event_id,title,completed,sort_order').order('sort_order'),db.from('accepted_quote_terms').select('id,enquiry_id,quote_number,version,total_payable_eur,deposit_payable_eur,billing_mode,tax_details'),db.from('event_payment_schedule').select('event_id,label,amount_eur,due_on,status').order('due_on',{ascending:true})]);if(epoch!==refreshEpoch)return;requests=rq.data||[];documents=dc.data||[];notifications=nt.data||[];contracts=ct.data||[];tasks=tk.data||[];quoteTerms=qt.data||[];payments=py.data||[];if(rq.error||dc.error||nt.error||ct.error||tk.error||qt.error||py.error)return show('<p class="error">'+esc((rq.error||dc.error||nt.error||ct.error||tk.error||qt.error||py.error).message)+'</p>');if(result.error)return show('<h2>'+t('accessError')+'</h2><p class="error">'+esc(result.error.message)+'</p>')}else{events=[];requests=[];documents=[];notifications=[];contracts=[];tasks=[];quoteTerms=[];payments=[];}render()}
function render(){if(me&&role==='admin'){renderDepartments();return}let x='<h1>'+t('title')+'</h1><p class="muted">'+t('subtitle')+'</p>';if(!db){x+='<div class="card"><p class="error">'+t('unconfigured')+'</p><p class="muted">Demo pública: <a href="./index.html">Flamenco Events App</a></p></div>';show(x);return}if(!me){x+='<form class="card" onsubmit="login(event)"><h2>'+t('login')+'</h2><label class="field"><span>'+t('email')+'</span><input required type="email" name="email" autocomplete="email" maxlength="254"></label><button>'+t('send')+'</button></form>';show(x);return}x+='<div class="label">'+esc(me.email)+' · '+(role==='admin'?'Administrador / Administrator':role==='sales'?t('staff'):t('event'))+'</div>';x+=(role==='admin'?'<p><a href="./admin.html">Administración / Administration</a> · <a href="./staff.html">Equipo / Team</a></p>':role==='sales'?'<p><a href="./staff.html">Equipo / Team</a></p>':'');x+='<h2>'+t('notifications')+'</h2>'+(notifications.length?notifications.map(n=>'<div class="card"><p>'+esc(n.body)+'</p><small>'+esc(new Date(n.created_at).toLocaleDateString())+'</small> '+(n.read_at?'':'<button class="secondary" data-notification="'+esc(n.id)+'">'+t('markRead')+'</button>')+'</div>').join(''):'<p class="muted">'+t('noNotifications')+'</p>');if(!events.length)x+='<div class="card">'+t('noevents')+'</div>';else x+=events.map(e=>'<section class="card"><span class="status">'+esc(window.FEState.label(e.status,language))+'</span><h2>'+esc(e.title)+'</h2><p class="muted">'+esc(e.event_date||'')+' · '+esc(e.venue||'')+' · '+esc(e.performance||'')+'</p><div class="grid">'+[['repertoire',e.repertoire],['wardrobe',e.wardrobe],['schedule',e.schedule_notes],['contact',e.onsite_contact]].map(([k,v])=>'<div class="card"><div class="label">'+t(k)+'</div><p>'+esc(v||t('none'))+'</p></div>').join('')+'</div><h3>'+t('acceptedQuote')+'</h3>'+(quoteTerms.filter(q=>q.id===e.quote_terms_id).map(q=>window.FEWorkflow.quoteHtml(q,language)).join('')||'<p class="muted">'+t('nodoc')+'</p>')+'<h3>'+t('payments')+'</h3>'+(payments.filter(p=>p.event_id===e.id).map(p=>'<div class="card"><b>'+esc(p.label)+'</b><p>'+esc(new Intl.NumberFormat(language==='es'?'es-ES':'en-GB',{style:'currency',currency:'EUR'}).format(p.amount_eur))+' · '+esc(p.status==='received'?(language==='es'?'Recibido':'Received'):(language==='es'?'Pendiente':'Pending'))+(p.due_on?' · '+esc(p.due_on):'')+'</p></div>').join('')||'<p class="muted">'+t('noPayments')+'</p>')+'<h3>'+t('tasks')+'</h3>'+(tasks.filter(task=>task.event_id===e.id).map(task=>'<div class="card">'+(task.completed?'✓ ':'○ ')+esc(task.title)+'</div>').join('')||'<p class="muted">'+t('noTasks')+'</p>')+'<h3>'+t('documents')+'</h3><div class="docs">'+(documents.filter(d=>d.event_id===e.id).map(d=>'<button class="secondary" data-document="'+esc(d.storage_path)+'">'+esc(window.FEState.label(d.kind,language))+' v'+esc(d.version)+'</button>').join('')||t('nodoc'))+'</div><p class="muted">'+(contracts.find(c=>c.event_id===e.id)?t('contract')+': '+esc(window.FEState.label(contracts.find(c=>c.event_id===e.id).state,language)):t('contractPending'))+'</p><p class="muted">'+t('booking')+'</p><h3>'+t('updates')+'</h3><form onsubmit="sendMessage(event,\''+esc(e.id)+'\')"><label class="field"><span>'+t('message')+'</span><textarea name="message" required maxlength="3000"></textarea></label><button>'+t('sendchange')+'</button></form><div id="thread-'+esc(e.id)+'"></div><button class="secondary" onclick="loadMessages(\''+esc(e.id)+'\')">'+t('messages')+'</button><h3>'+t('proposals')+'</h3><form data-proposal="'+esc(e.id)+'"><select name="topic" aria-label="'+t('proposalTopic')+'"><option value="repertoire">'+t('repertoire')+'</option><option value="wardrobe">'+t('wardrobe')+'</option><option value="schedule">'+t('schedule')+'</option><option value="other">'+t('other')+'</option></select><textarea name="details" aria-label="'+t('proposalDetails')+'" required minlength="3" maxlength="3000"></textarea><button>'+t('proposalSend')+'</button></form>'+requests.filter(q=>q.event_id===e.id).map(q=>'<div class="card">'+esc(t(q.topic==='schedule'?'schedule':q.topic))+' · '+esc(t(q.status))+'<p>'+esc(q.details)+'</p></div>').join('')+'</section>').join('');show(x)}

function selectDepartment(value){if(role!=='admin'||!me)return;department=['home','marketing','rrhh'].includes(value)?value:'home';render()}
function renderDepartments(){
  const en=language==='en',labels=en?{heading:'Management departments',sub:'Choose a department to access your management workspace.',admin:'Administration',marketing:'Marketing',hr:'Human Resources',open:'Open administration',back:'Back to departments',pending:'Department workspace under preparation. No customer or employee data is displayed here.',marketingDesc:'Campaigns, content and commercial visibility.',hrDesc:'Team, artists and personnel coordination.'}:{heading:'Departamentos de gestión',sub:'Selecciona el departamento al que deseas acceder.',admin:'Administración',marketing:'Marketing',hr:'Recursos Humanos',open:'Entrar en Administración',back:'Volver a departamentos',pending:'Espacio de trabajo en preparación. Aquí todavía no se muestran datos de clientes ni del personal.',marketingDesc:'Campañas, contenidos y visibilidad comercial.',hrDesc:'Equipo, artistas y coordinación de personal.'};
  const options='<option value="home">'+esc(labels.heading)+'</option><option value="admin">'+esc(labels.admin)+'</option><option value="marketing">'+esc(labels.marketing)+'</option><option value="rrhh">'+esc(labels.hr)+'</option>';
  let x='<div class="label">'+esc(me.email)+' · '+(en?'Administrator':'Administrador')+'</div><h1>'+esc(labels.heading)+'</h1><p class="muted">'+esc(labels.sub)+'</p><label class="field"><span>'+esc(en?'Department':'Departamento')+'</span><select aria-label="'+esc(en?'Select department':'Seleccionar departamento')+'" onchange="selectDepartment(this.value)">'+options.replace('value="'+department+'"','value="'+department+'" selected')+'</select></label>';
  if(department==='home'){
    x+='<div class="grid"><section class="card"><h2>'+esc(labels.admin)+'</h2><p>'+esc(en?'Events, clients, contracts and operations.':'Eventos, clientes, contratos y operaciones.')+'</p><button onclick="location.href=\'./admin.html\'">'+esc(labels.open)+'</button></section><section class="card"><h2>'+esc(labels.marketing)+'</h2><p>'+esc(labels.marketingDesc)+'</p><button class="secondary" onclick="location.href=\'./marketing.html\'">'+esc(en?'View department':'Ver departamento')+'</button></section><section class="card"><h2>'+esc(labels.hr)+'</h2><p>'+esc(labels.hrDesc)+'</p><button class="secondary" onclick="selectDepartment(\'rrhh\')">'+esc(en?'View department':'Ver departamento')+'</button></section></div>';
  }else if(department==='marketing'||department==='rrhh'){
    x+='<section class="card"><h2>'+esc(department==='marketing'?labels.marketing:labels.hr)+'</h2><p>'+esc(department==='marketing'?labels.marketingDesc:labels.hrDesc)+'</p>'+(department==='marketing'?'<p><a href="./marketing.html">'+esc(en?'Open marketing plan':'Abrir plan de marketing')+'</a></p>':'<p class="muted">'+esc(labels.pending)+'</p>')+'<button class="secondary" onclick="selectDepartment(\'home\')">'+esc(labels.back)+'</button></section>';
  }else{
    x+='<section class="card"><h2>'+esc(labels.admin)+'</h2><p><a href="./admin.html">'+esc(labels.open)+'</a></p><button class="secondary" onclick="selectDepartment(\'home\')">'+esc(labels.back)+'</button></section>';
  }
  show(x);
}

async function markRead(id){if(!db||!me)return;const x=await db.from('notifications').update({read_at:new Date().toISOString()}).eq('id',id).eq('recipient_id',me.id);if(x.error)alert(x.error.message);else refresh()}
async function openDocument(path){const actorId=me?.id,epoch=refreshEpoch;if(!db||!actorId)return;try{const {data,error}=await db.storage.from('event-documents').createSignedUrl(path,60);if(me?.id!==actorId||epoch!==refreshEpoch)return;if(error){alert(error.message);return}if(data?.signedUrl)window.open(data.signedUrl,'_blank','noopener')}catch(error){if(me?.id===actorId&&epoch===refreshEpoch)alert(t('connectionUncertain'))}}
// Locks prevent concurrent clicks only; ambiguous network failures are never retried automatically.
const pendingSubmissions=new Set();
Object.assign(dict.es,{connectionUncertain:'No se pudo confirmar la operación. Comprueba su estado antes de repetirla.'});
Object.assign(dict.en,{connectionUncertain:'The operation could not be confirmed. Check its status before trying again.'});
async function submitOnce(form,key,operation,onSuccess){const actorId=me?.id,epoch=refreshEpoch;if(!db||!actorId)return;const lock=actorId+':'+key;if(pendingSubmissions.has(lock))return;pendingSubmissions.add(lock);const buttons=Array.from(form.querySelectorAll('button')),previous=buttons.map(b=>b.disabled);buttons.forEach(b=>b.disabled=true);form.setAttribute('aria-busy','true');try{const result=await operation(actorId);if(me?.id!==actorId||epoch!==refreshEpoch)return;if(result.error)alert(result.error.message);else await onSuccess()}catch(error){if(me?.id===actorId&&epoch===refreshEpoch)alert(t('connectionUncertain'))}finally{pendingSubmissions.delete(lock);buttons.forEach((b,i)=>b.disabled=previous[i]);form.removeAttribute('aria-busy')}}
async function submitRequest(e,id){e.preventDefault();const f=e.target,details=f.elements.details.value.trim(),topic=f.elements.topic.value;if(details.length<3||details.length>3000)return;await submitOnce(f,'proposal:'+id,actorId=>db.from('event_change_requests').insert({event_id:id,requester_id:actorId,topic,details}),async()=>{f.reset();await refresh()})}
async function login(e){e.preventDefault();let email=e.target.email.value;const cfg=window.FE_PORTAL_CONFIG;const {error}=await db.auth.signInWithOtp({email,options:{shouldCreateUser:false,emailRedirectTo:cfg.redirectUrl||location.href.split('#')[0]}});alert(error?error.message:t('sent'))}
async function signOut(){++refreshEpoch;me=null;department='home';events=[];requests=[];documents=[];notifications=[];contracts=[];tasks=[];quoteTerms=[];payments=[];render();if(db)await db.auth.signOut()}
async function sendMessage(e,id){e.preventDefault();const f=e.target,message=f.message.value.trim();if(!message||message.length>3000)return;await submitOnce(f,'message:'+id,actorId=>db.from('event_messages').insert({event_id:id,author_id:actorId,message}),async()=>{f.reset();alert(t('saved'));await loadMessages(id)})}
async function loadMessages(id){const actorId=me?.id,epoch=refreshEpoch;if(!actorId)return;const {data,error}=await db.from('event_messages').select('author_id,message,created_at').eq('event_id',id).order('created_at',{ascending:true});let el=document.getElementById('thread-'+id);if(!el||me?.id!==actorId||epoch!==refreshEpoch)return;el.innerHTML=error?'<p class="error">'+esc(error.message)+'</p>':(data||[]).map(m=>'<div class="card"><div class="label">'+(m.author_id===me.id?t('meLabel'):'Flamenco Events')+' · '+esc(new Date(m.created_at).toLocaleDateString())+'</div><p>'+esc(m.message)+'</p></div>').join('')}
document.getElementById('app').addEventListener('click',e=>{const el=e.target.closest('[data-document]');if(el)openDocument(el.dataset.document);const n=e.target.closest('[data-notification]');if(n)markRead(n.dataset.notification)});
document.getElementById('app').addEventListener('submit',e=>{const f=e.target.closest('[data-proposal]');if(f)submitRequest(e,f.dataset.proposal)});
start();
</script></body></html>
